name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Install Python
        run: uv python install
      - name: Sync environment
        run: uv sync --locked
      - name: Run tests
        run: uv run --locked pytest
